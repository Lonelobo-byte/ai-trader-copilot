<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX AI Breakout Radar & Momentum Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260729-tape1">
  <style>
    /* Radar custom layout adjustments */
    html,
    body.single-page {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .main-wrapper,
    .radar-container {
      min-width: 0;
    }

    .radar-header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .radar-container {
      padding: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .radar-summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .radar-summary-card {
      border-left: 3px solid var(--neon-blue);
    }

    .radar-summary-card.active-breakouts {
      border-left-color: var(--neon-purple);
    }

    .radar-summary-card.hot-zones {
      border-left-color: var(--neon-gold);
    }

    .radar-summary-metric {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.9rem;
      margin-top: 0.5rem;
      min-width: 0;
    }

    .radar-summary-metric > h2 {
      flex: 0 1 auto;
      min-width: 0;
    }

    .radar-summary-caption {
      flex: 0 1 10.5rem;
      min-width: 7rem;
      margin-bottom: 2px;
      white-space: normal;
      text-align: right;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .radar-filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      background: rgba(13, 20, 35, 0.35);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 15px;
      cursor: pointer;
      transition: all var(--transition-speed);
    }

    .filter-btn:hover {
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.02);
    }

    .filter-btn.active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .filter-btn.active.bullish {
      color: var(--neon-green);
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .filter-btn.active.bearish {
      color: var(--neon-red);
      background: rgba(244, 63, 94, 0.08);
      border-color: rgba(244, 63, 94, 0.2);
    }

    .radar-refresh-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .radar-refresh-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--neon-blue);
      border-radius: 50%;
    }

    .radar-refresh-spinner.is-active {
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Radar Table Styles */
    .radar-table-container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      contain: inline-size;
      max-width: 100%;
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }

    .radar-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .radar-table th:last-child,
    .radar-table td:last-child {
      position: sticky;
      right: 0;
      z-index: 2;
      min-width: 9.5rem;
      background: rgba(11, 17, 29, 0.97);
      box-shadow: -10px 0 18px rgba(0, 0, 0, 0.2);
    }

    .radar-table th:last-child {
      z-index: 3;
      background: rgba(8, 13, 23, 0.99);
    }

    .radar-table tr:hover td:last-child {
      background: rgba(14, 22, 36, 0.99);
    }

    .radar-table th {
      background: rgba(0, 0, 0, 0.12);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding: 1.1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .radar-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.85rem;
      vertical-align: middle;
    }

    .radar-table tr:hover {
      background: rgba(255, 255, 255, 0.015);
    }

    .symbol-cell {
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .symbol-logo {
      font-size: 1.1rem;
    }

    .score-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .score-badge {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.85rem;
      width: 32px;
      text-align: right;
    }

    .score-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
      max-width: 100px;
    }

    .score-fill {
      height: 100%;
      border-radius: 3px;
    }

    .score-high {
      color: var(--neon-green);
    }

    .score-high-fill {
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green-glow);
    }

    .score-medium {
      color: var(--neon-gold);
    }

    .score-medium-fill {
      background: var(--neon-gold);
      box-shadow: 0 0 8px var(--neon-gold-glow);
    }

    .score-low {
      color: var(--text-muted);
    }

    .score-low-fill {
      background: var(--text-muted);
    }

    .direction-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .direction-badge.bullish {
      background: rgba(16, 185, 129, 0.1);
      color: var(--neon-green);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .direction-badge.bearish {
      background: rgba(244, 63, 94, 0.1);
      color: var(--neon-red);
      border: 1px solid rgba(244, 63, 94, 0.2);
    }

    .radar-table .value-mono {
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .change-pos {
      color: var(--neon-green);
    }

    .change-neg {
      color: var(--neon-red);
    }

    .priority-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .priority-badge.critical {
      background: rgba(139, 92, 246, 0.12);
      color: var(--neon-purple);
      border: 1px solid rgba(139, 92, 246, 0.2);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.05);
    }

    .priority-badge.high {
      background: rgba(251, 191, 36, 0.1);
      color: var(--neon-gold);
      border: 1px solid rgba(251, 191, 36, 0.2);
    }

    .priority-badge.medium {
      background: rgba(6, 182, 212, 0.08);
      color: var(--neon-blue);
      border: 1px solid rgba(6, 182, 212, 0.15);
    }

    .priority-badge.low {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Top-Left AI & Quality Badge Tags */
    .top-badge-tag {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .badge-verified {
      background: rgba(80, 205, 137, 0.18);
      color: #50cd89;
      border: 1px solid rgba(80, 205, 137, 0.5);
      box-shadow: 0 0 8px rgba(80, 205, 137, 0.25);
    }

    .badge-rejected {
      background: rgba(241, 65, 108, 0.2);
      color: #f1416c;
      border: 1px solid rgba(241, 65, 108, 0.6);
      box-shadow: 0 0 8px rgba(241, 65, 108, 0.25);
    }

    .badge-top-tier {
      background: rgba(241, 188, 0, 0.18);
      color: #ffc700;
      border: 1px solid rgba(241, 188, 0, 0.5);
      box-shadow: 0 0 8px rgba(241, 188, 0, 0.2);
    }

    .badge-quant {
      background: rgba(62, 151, 255, 0.12);
      color: #3e97ff;
      border: 1px solid rgba(62, 151, 255, 0.3);
    }

    .row-verified {
      border-left: 3px solid #50cd89 !important;
      background: rgba(80, 205, 137, 0.02) !important;
    }

    .row-rejected {
      border-left: 3px solid #f1416c !important;
      background: rgba(241, 65, 108, 0.03) !important;
      opacity: 0.85;
    }

    .action-btn-sm {
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 5px 12px;
      border-radius: 6px;
      transition: all var(--transition-speed);
      cursor: pointer;
    }

    .action-btn-sm:hover {
      background: var(--neon-blue);
      border-color: var(--neon-blue);
      color: #000;
      box-shadow: 0 0 12px var(--neon-blue-glow);
    }

    .action-btn-sm.ai-btn {
      color: var(--neon-purple);
      border-color: rgba(139, 92, 246, 0.25);
      background: rgba(139, 92, 246, 0.03);
      margin-left: 0.35rem;
    }

    .action-btn-sm.ai-btn:hover {
      background: var(--neon-purple);
      border-color: var(--neon-purple);
      color: #fff;
      box-shadow: 0 0 12px var(--neon-purple-glow);
    }

    .radar-action-group {
      align-items: center;
      display: flex;
      gap: 0.35rem;
    }

    .action-btn-sm.research-btn {
      background: rgba(255, 255, 255, 0.025);
      border-color: rgba(255, 255, 255, 0.14);
      color: var(--text-secondary);
    }

    .action-btn-sm.research-btn:hover {
      background: rgba(62, 151, 255, 0.12);
      border-color: rgba(62, 151, 255, 0.55);
      color: #d8eaff;
    }

    .radar-empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--text-muted);
    }

    .radar-empty-state .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 1rem;
    }

    .radar-evidence-loading {
      align-items: center;
      display: flex;
      gap: clamp(1.25rem, 4vw, 3rem);
      justify-content: center;
      margin: 0 auto;
      max-width: 780px;
      min-height: 220px;
      padding: 2rem 1rem;
      text-align: left;
    }

    .evidence-radar-orbit {
      background: radial-gradient(circle, rgba(62, 151, 255, .12), rgba(62, 151, 255, .025) 48%, transparent 70%);
      border: 1px solid rgba(62, 151, 255, .3);
      border-radius: 50%;
      flex: 0 0 74px;
      height: 74px;
      overflow: visible;
      position: relative;
      width: 74px;
    }

    .evidence-radar-orbit::before,
    .evidence-radar-orbit::after {
      border: 1px solid rgba(62, 151, 255, .18);
      border-radius: 50%;
      content: '';
      inset: -13px;
      opacity: 0;
      position: absolute;
      animation: none;
    }

    .radar-evidence-loading.is-active .evidence-radar-orbit::before {
      animation: evidence-ping 2.6s ease-out infinite;
    }

    .radar-evidence-loading.is-active .evidence-radar-orbit::after {
      animation: evidence-ping 2.6s ease-out 1.3s infinite;
    }

    .evidence-radar-orbit span {
      background: conic-gradient(from 0deg, rgba(62, 151, 255, .4), transparent 30%);
      border-radius: inherit;
      inset: 0;
      position: absolute;
      animation: none;
    }

    .evidence-radar-orbit i {
      background: var(--neon-blue);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(62, 151, 255, .9);
      height: 6px;
      left: calc(50% - 3px);
      position: absolute;
      top: calc(50% - 3px);
      width: 6px;
    }

    .radar-evidence-loading.is-active .evidence-radar-orbit span {
      animation: evidence-sweep 3.5s linear infinite;
    }

    .evidence-loading-copy {
      flex: 1 1 460px;
      min-width: 0;
    }

    .evidence-loading-meta {
      align-items: center;
      color: var(--neon-blue);
      display: flex;
      font: 800 .61rem var(--font-mono);
      gap: .55rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .evidence-loading-meta::before {
      background: var(--neon-blue);
      border-radius: 50%;
      box-shadow: 0 0 9px rgba(62, 151, 255, .8);
      content: '';
      height: 5px;
      width: 5px;
    }

    .evidence-loading-copy h3 {
      color: var(--text-primary);
      font-size: 1.02rem;
      letter-spacing: -.015em;
      margin: .5rem 0 .25rem;
    }

    .evidence-loading-copy p {
      color: var(--text-muted);
      font-size: .72rem;
      line-height: 1.5;
      margin: 0;
    }

    .evidence-loading-stages {
      display: grid;
      gap: .55rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 1.2rem;
    }

    .evidence-stage {
      min-width: 0;
      opacity: .48;
    }

    .evidence-stage-label {
      align-items: center;
      color: var(--text-secondary);
      display: flex;
      font: 700 .57rem var(--font-mono);
      gap: .35rem;
      letter-spacing: .055em;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .evidence-stage-label::before {
      background: rgba(255, 255, 255, .32);
      border-radius: 50%;
      content: '';
      flex: 0 0 5px;
      height: 5px;
      width: 5px;
    }

    .evidence-stage-bar {
      background: rgba(255, 255, 255, .08);
      height: 2px;
      margin-top: .42rem;
      overflow: hidden;
      position: relative;
    }

    .evidence-stage.active {
      opacity: 1;
    }

    .evidence-stage.active .evidence-stage-label {
      color: #c9dfff;
    }

    .evidence-stage.active .evidence-stage-label::before {
      background: var(--neon-blue);
      box-shadow: 0 0 8px rgba(62, 151, 255, .8);
    }

    .evidence-stage.active .evidence-stage-bar::after {
      animation: none;
      background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
      content: '';
      inset: 0;
      position: absolute;
      transform: translateX(-100%);
    }

    .radar-evidence-loading.is-active .evidence-stage.active .evidence-stage-bar::after {
      animation: evidence-shimmer 1.7s ease-in-out infinite;
    }

    .evidence-loading-progress {
      background: rgba(255, 255, 255, .07);
      border-radius: 999px;
      height: 3px;
      margin-top: 1.1rem;
      overflow: hidden;
    }

    .evidence-loading-progress span {
      animation: none;
      background: linear-gradient(90deg, transparent, rgba(62, 151, 255, .95), transparent);
      display: block;
      height: 100%;
      transform: translateX(-100%);
      width: 42%;
    }

    .radar-evidence-loading.is-active .evidence-loading-progress span {
      animation: evidence-progress 1.8s ease-in-out infinite;
    }

    @keyframes evidence-ping {
      0% {
        opacity: .7;
        transform: scale(.7);
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
      }
    }

    @keyframes evidence-sweep {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes evidence-shimmer {
      to {
        transform: translateX(100%);
      }
    }

    @keyframes evidence-progress {
      to {
        transform: translateX(340%);
      }
    }

    @media (max-width: 640px) {
      .radar-evidence-loading {
        align-items: flex-start;
        flex-direction: column;
        min-height: 260px;
        padding: 1.5rem .3rem;
      }

      .evidence-radar-orbit {
        margin-left: .8rem;
      }

      .evidence-loading-copy {
        flex-basis: auto;
        width: 100%;
      }

      .evidence-loading-stages {
        gap: .38rem;
      }

      .evidence-stage-label {
        font-size: .51rem;
      }
    }

    /* Premium Modal Window */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(4, 6, 12, 0.85);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(12, 22, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      max-width: 650px;
      width: 100%;
      box-shadow: var(--shadow-lg), 0 0 30px rgba(139, 92, 246, 0.1);
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.15);
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
      color: var(--text-primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--neon-red);
    }

    .modal-body {
      padding: 1.5rem;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* AI Result Card Styling */
    .ai-verdict-banner {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .verdict-continuation {
      background: rgba(16, 185, 129, 0.1);
      color: var(--neon-green);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .verdict-pullback {
      background: rgba(6, 182, 212, 0.1);
      color: var(--neon-blue);
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .verdict-sweep {
      background: rgba(139, 92, 246, 0.1);
      color: var(--neon-purple);
      border: 1px solid rgba(139, 92, 246, 0.25);
    }

    .verdict-reversal {
      background: rgba(244, 63, 94, 0.1);
      color: var(--neon-red);
      border: 1px solid rgba(244, 63, 94, 0.25);
    }

    .ai-levels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .ai-level-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      text-align: center;
    }

    .ai-level-item span {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .ai-level-item strong {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .ai-level-item.invalid strong {
      color: var(--neon-red);
    }

    .ai-reasoning-section {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1rem;
    }

    .ai-reasoning-section h4 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .ai-reasoning-list {
      margin-left: 1.25rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .ai-reasoning-list li {
      margin-bottom: 0.5rem;
    }

    .ai-loading-box {
      text-align: center;
      padding: 3rem 1rem;
    }

    .ai-loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(139, 92, 246, 0.1);
      border-top-color: var(--neon-purple);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 1s infinite linear;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
    }

    .top-research-btn {

    }

    .radar-story-detail > header span {
      margin-bottom: .18rem;
      color: var(--story-color);
      font: 800 .5rem var(--font-mono);
      letter-spacing: .09em;

    .radar-story-detail > header strong {
      color: var(--text-primary);
      font-size: .7rem;
    }

    .radar-story-detail > header b {

    .radar-story-meta {

      padding: .43rem .47rem;
      background: rgba(2, 6, 13, .8);
    }

    .radar-story-meta small,
    .radar-story-meta strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .radar-story-meta small {
      margin-bottom: .14rem;
      color: var(--text-muted);
      font: 800 .46rem var(--font-mono);
    }

    .radar-story-meta strong {
      color: var(--text-secondary);
      font: 800 .53rem var(--font-mono);
    }

    .radar-story-sequence {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .4rem;
      padding: .55rem .72rem;
    }

    .radar-story-sequence article {
      min-width: 0;
      padding: .5rem .52rem;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 7px;
      background: rgba(0, 0, 0, .15);

    .radar-story-sequence article > span {
      color: var(--story-color);
      font: 800 .47rem var(--font-mono);
      letter-spacing: .055em;

    .radar-story-sequence p {
      margin: .32rem 0 0;
      color: var(--text-secondary);
      font-size: .58rem;
      line-height: 1.45;

    .radar-story-sequence small {
      display: block;
      margin-top: .31rem;
      padding-top: .28rem;
      border-top: 1px solid rgba(255, 255, 255, .055);
      color: var(--text-muted);
      font-size: .5rem;
      line-height: 1.4;
    }

    .radar-story-detail > footer {
      padding: .46rem .72rem;
      border-top: 1px solid rgba(255, 255, 255, .055);
      color: var(--story-color);
      background: rgba(0, 0, 0, .13);
      font: 800 .5rem var(--font-mono);
      letter-spacing: .055em;
    }

    /* Calm operational feedback: Radar animates state changes, never prices. */
    .radar-summary-card,
    .radar-table-container,
    .radar-research-brief,
    .research-evidence-cell {
      transition: border-color .22s cubic-bezier(.2, .8, .2, 1), background-color .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s cubic-bezier(.2, .8, .2, 1), transform .22s cubic-bezier(.2, .8, .2, 1);
    }

    .radar-summary-card:hover,
    .radar-research-brief:hover {
      border-color: rgba(62, 151, 255, .2);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .16);
    }

    .research-evidence-cell:hover {
      border-color: rgba(255, 255, 255, .13);
      background: rgba(255, 255, 255, .035);
    }

    .filter-btn:focus-visible,
    .action-btn-sm:focus-visible,
    .top-research-btn:focus-visible,
    .research-expand:focus-visible,
    .modal-close:focus-visible {
      outline: 2px solid rgba(62, 151, 255, .8);
      outline-offset: 3px;
    }

    .filter-btn:active,
    .action-btn-sm:active,
    .top-research-btn:not(:disabled):active {
      transform: scale(.98);
    }

    .radar-refresh-spinner {
      filter: drop-shadow(0 0 4px rgba(62, 151, 255, .42));
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 900px) {
      .research-evidence-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {

      .radar-research-heading,
      .research-brief-summary {
        align-items: flex-start;
      }

      .radar-research-heading {
        flex-direction: column;
      }

      .research-brief-summary {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .research-brief-state {
        grid-column: 2;
        justify-self: start;
      }

      .research-evidence-grid,
      .research-brief-footer {
        grid-template-columns: 1fr;
      }

      .top-research-btn {
        max-width: 100%;
      }

      .radar-story-detail > header {
        flex-direction: column;
      }

      .radar-story-meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .radar-story-sequence {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <script>
      // Mount the approved Causal Flight Deck.
      const radarContainer = document.querySelector('main.radar-container');
      radarContainer.innerHTML = `
        <section class="flight-deck" aria-label="Causal Flight Deck">
          <header class="flight-ribbon">
            <div class="flight-pulse">
              <span class="flight-radar-mini" aria-hidden="true"></span>
              <span class="flight-pulse-copy"><small class="flight-eyebrow">Market pulse</small><strong>SCAN ACTIVE</strong></span>
            </div>
            <div class="flight-metrics" aria-label="Radar summary">
              <span class="flight-metric review"><small class="flight-eyebrow">Recommended</small><strong id="summary-breakout-count">0</strong></span>
              <span class="flight-metric score"><small class="flight-eyebrow">Top evidence</small><strong><span id="summary-top-score">-</span> <small id="summary-top-symbol">-</small></strong></span>
              <span class="flight-metric volatility"><small class="flight-eyebrow">Volatility</small><strong id="summary-vol-state">NORMAL</strong></span>
            </div>
            <div class="flight-controls">
              <div class="flight-filter-group">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="recommended">Candidates</button>
                <button class="filter-btn" data-filter="bullish">Bullish</button>
                <button class="filter-btn" data-filter="bearish">Bearish</button>
              </div>
              <select id="scan-mode-select" class="flight-scan-select" aria-label="Radar scan mode">
                <option value="5m,1h">Scalp · 5m / 1h</option>
                <option value="15m,4h" selected>Intraday · 15m / 4h</option>
                <option value="1h,1d">Swing · 1h / 1d</option>
              </select>
              <button id="ai-radar-btn" class="top-research-btn" type="button" onclick="buildTopResearchBriefs()">
                <span>Build Top-3 Briefs</span>
                <span class="top-research-btn-state" id="top-research-btn-state">READY</span>
              </button>
            </div>
          </header>
          <div class="flight-main">
            <aside class="flight-opportunities" aria-label="Ranked market opportunities">
              <div class="flight-pane-heading">
                <strong>Ranked Opportunities</strong>
                <span class="flight-refresh"><span class="radar-refresh-spinner" id="refresh-spinner"></span><span id="refresh-text">Next scan in 30s</span></span>
              </div>
              <div class="flight-opportunity-list" id="radar-records-tbody" role="listbox" aria-label="Ranked market opportunities" aria-live="polite"></div>
            </aside>
            <section class="flight-intelligence" id="flight-intelligence" aria-live="polite">
              <div class="flight-stage" id="flight-intelligence-stage">
                <div class="flight-stage-empty"><div>
                  <span class="flight-radar-mini flight-stage-radar" aria-hidden="true"></span>
                  <strong>Building the causal intelligence stage</strong>
                  <p>Radar is aligning completed-candle structure, liquidity, positioning and order flow. Select an opportunity when the shared scan completes.</p>
                </div></div>
              </div>
              <section class="radar-research-briefs" id="radar-research-briefs" hidden aria-live="polite">
                <div class="radar-research-heading">
                  <div>
                    <span class="research-kicker">Deterministic evidence · manual research</span>
                    <h2>Top-3 Research Briefs</h2>
                    <p id="research-briefs-summary">Each brief explains the current context without changing Radar's ranking or authorizing a trade.</p>
                  </div>
                  <span class="research-run-status" id="research-run-status">READY</span>
                </div>
                <div class="research-brief-list" id="research-brief-list"></div>
              </section>
            </section>
          </div>
        </section>`;
      // State management
      let activeFilter = 'all';
      let rawBreakouts = [];
      let selectedRadarSymbol = '';
      let isBuildingResearchBriefs = false;
      let radarScanReady = false;
      let refreshTimer = null;
      let secondsRemaining = 30;
      let nextRadarRefreshAtMs = 0;
      let radarServerClockOffsetMs = 0;
      let isFetchingRadar = false;
      let radarSnapshotStale = false;
      let radarSnapshotAtMs = 0;
      let radarFailureCount = 0;

      function setResearchButtonState(state = 'READY') {
        const button = document.getElementById('ai-radar-btn');
        const badge = document.getElementById('top-research-btn-state');
        if (!button || !badge) return;
        const building = state === 'BUILDING';
        const empty = state === 'EMPTY';
        const scanning = state === 'SCANNING';
        const stale = state === 'STALE';
        const ready = radarScanReady && rawBreakouts.length > 0 && !building;

      // Radar is a separate static surface, so it does not inherit the

      const radarOriginalFetch = window.fetch.bind(window);
      const radarAccessToken = () => sessionStorage.getItem('atc_access_token') || '';
      let radarRefreshInFlight = null;
      async function radarReadApiPayload(response) {
        const raw = await response.text();
        if (!raw) return {};
        try { return JSON.parse(raw); }
        catch (_) { return { detail: raw.slice(0, 500) || `Request failed with HTTP ${response.status}.` }; }
      }
      function radarTokenExpiresWithin(token, seconds = 60) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
          return !payload.exp || Number(payload.exp) * 1000 - Date.now() <= seconds * 1000;
        } catch (_) {
          return true;
        }
      }
      async function refreshRadarToken() {
        if (radarRefreshInFlight) return radarRefreshInFlight;
        radarRefreshInFlight = (async () => {
          const response = await radarOriginalFetch('/auth/refresh', { method: 'POST', credentials: 'same-origin' });
          const data = await radarReadApiPayload(response);
          if (!response.ok) {
            sessionStorage.removeItem('atc_access_token');
            throw new Error(data.detail || 'Your Radar session expired. Please sign in again.');
          }
          sessionStorage.setItem('atc_access_token', data.access_token);
          return data.access_token;
        })();
        try { return await radarRefreshInFlight; }
        finally { radarRefreshInFlight = null; }
      }
      async function ensureRadarAccessToken(forceRefresh = false) {
        const token = radarAccessToken();
        if (!forceRefresh && token && !radarTokenExpiresWithin(token)) return token;
        return refreshRadarToken();
      }
      async function premiumRadarFetch(url, options = {}, retried = false) {
        let token = await ensureRadarAccessToken();
        const headers = new Headers(options.headers || {});
        headers.set('Authorization', `Bearer ${token}`);
        const response = await radarOriginalFetch(url, { ...options, headers, credentials: 'same-origin' });
        if (response.status !== 401 || retried) return response;
        token = await ensureRadarAccessToken(true);
        headers.set('Authorization', `Bearer ${token}`);
        return radarOriginalFetch(url, { ...options, headers, credentials: 'same-origin' });

      function publicRadarFetch(url, options = {}) {

        // never refreshes or requires a session just to render market context.
        const headers = new Headers(options.headers || {});
        const token = radarAccessToken();

      function radarStoryView(payload = {}) {
        const story = payload.market_story || payload.market_structure?.story || {};
        const directional = payload.market_context?.actionability || payload.actionability || story.actionability || {};
        const directionalOwnsEvent = Object.prototype.hasOwnProperty.call(directional, 'aligned_event')

        const event = directional.aligned_event
          || directional.selected_event
          || (directionalOwnsEvent ? {} : story.latest_event)
          || {};
        const baseState = directional.state || story.current_state || story.actionability?.status || 'NO_ACTIVE_EVENT';
        const liveLocation = payload.advanced_confirmation?.market_story_live_location || {};
        const liveLocationExtended = liveLocation.evaluated === true && liveLocation.passed === false;
        const state = liveLocationExtended ? 'LIVE_LOCATION_EXTENDED' : baseState;
        const pullbackRequired = String(state).toUpperCase() === 'PULLBACK_REQUIRED';
        const rawDirection = directional.direction || event.direction || story.actionability?.direction || payload.direction || 'NEUTRAL';
        const direction = rawDirection === 'LONG' ? 'BULLISH' : rawDirection === 'SHORT' ? 'BEARISH' : rawDirection;
        const explicitActionable = typeof directional.actionable === 'boolean'
          ? directional.actionable
          : story.actionability?.actionable;
        const actionable = explicitActionable === true;
        // The directional view owns lifecycle state when it exists. The
        // story-level actionability may describe a newer event on the opposite
        // side, so OR-ing both values can incorrectly mark a valid retest as
        // "do not chase".
        const explicitChaseRule = typeof directional.chase_prohibited === 'boolean'
          ? directional.chase_prohibited
          : directionalOwnsEvent
            ? false
            : story.actionability?.chase_prohibited;
        const chaseProhibited = liveLocationExtended || explicitChaseRule === true
          || ['EXTENDED_DO_NOT_CHASE', 'LATE_STRUCTURE_DO_NOT_CHASE', 'PULLBACK_REQUIRED', 'MISSED', 'INVALIDATED', 'EXPIRED'].includes(String(state).toUpperCase());
        const eventType = event.type || story.actionability?.event_type || 'NO ACTIVE EVENT';
        const age = event.age_bars ?? story.actionability?.event_age_bars;
        const level = event.break_level ?? event.broken_level ?? event.swept_level ?? story.actionability?.event_level;
        const invalidation = event.invalidation_level;
        const eventMatchesLatest = !event.event_id || !story.latest_event?.event_id || event.event_id === story.latest_event.event_id;
        const nextScenarios = eventMatchesLatest && Array.isArray(story.next_scenarios) ? story.next_scenarios : [];
        const continuation = nextScenarios.find(item => item?.scenario === 'CONTINUATION') || null;
        const failure = nextScenarios.find(item => item?.scenario === 'FAILURE_OR_REVERSAL') || null;
        const happened = eventMatchesLatest && story.what_happened
          ? story.what_happened

            ? `A ${String(direction).toLowerCase()} ${researchLabel(eventType, 'market event').toLowerCase()} occurred ${Number(age) === 0 ? 'on the latest completed candle' : `${age ?? 'an unknown number of'} completed bars ago`} through ${formatResearchPrice(level)}.`
            : 'No recent completed-candle structure break or liquidity sweep is active.';
        const happeningNow = liveLocationExtended
          ? `Live price moved ${Number(liveLocation.distance_atr).toFixed(2)} event ATR beyond the completed-candle level; the review location has moved away.`
          : directional.reason || story.what_is_happening || 'Current price location is awaiting completed-candle classification.';
        const next = continuation?.condition || (
          String(direction).toUpperCase() === 'BULLISH'
            ? 'Continuation requires completed closes to hold the event level while causal evidence remains bullish.'
            : String(direction).toUpperCase() === 'BEARISH'
              ? 'Continuation requires completed closes to hold below the event level while causal evidence remains bearish.'
              : 'Wait for a fresh completed event with aligned causal evidence.'
        );
        const failureCondition = failure?.condition || (
          String(direction).toUpperCase() === 'BULLISH'
            ? 'A completed close below invalidation, or a newer bearish event, cancels this branch.'
            : String(direction).toUpperCase() === 'BEARISH'
              ? 'A completed close above invalidation, or a newer bullish event, cancels this branch.'
              : 'Remain in observation mode until a directional event becomes active.'
        );
        const normalizedState = String(state).toUpperCase();
        const tone = normalizedState === 'INVALIDATED'
          ? 'invalidated'

            ? 'monitoring'
          : chaseProhibited
            ? 'stale'
            : actionable
              ? 'actionable'
              : 'monitoring';
        return {
          available: story.available === true || Boolean(event.detected || event.event_id),
          state,
          direction,
          actionable,
          chaseProhibited,
          pullbackRequired,
          tone,
          eventType,
          eventId: event.event_id || story.actionability?.event_id || null,
          age,
          level,
          invalidation,
          happened,
          happeningNow,
          next,
          failureCondition,
        };
      }

      function flightRewardRisk(item, story) {
        if (item.close_price == null || item.target_pool?.price == null || story.invalidation == null) {

        recordsTbody.querySelectorAll('[data-radar-symbol]').forEach(card => {
          card.addEventListener('click', event => {
            if (!event.target.closest('[data-review-symbol]')) selectRadarOpportunity(card.dataset.radarSymbol);
          });
          card.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              selectRadarOpportunity(card.dataset.radarSymbol);
            }
          });
        });
        recordsTbody.querySelectorAll('[data-review-symbol]').forEach(button => {
          button.addEventListener('click', event => {
            event.stopPropagation();
            if (radarSnapshotStale) return;
            selectRadarOpportunity(button.dataset.reviewSymbol);
            verifySetupWithAI(button.dataset.reviewSymbol);
          });
        });
        renderFlightStage(filtered.find(item => item.symbol === selectedRadarSymbol) || filtered[0]);
      }


      // Causal review overrides the legacy AI/indicator modal copy.
      async function verifySetupWithAI(symbol) {
        modalTitleSymbol.textContent = `Causal research brief: ${symbol}`;
        modalOverlay.classList.add('active');
        modalBodyContent.innerHTML = `<div class="ai-loading-box"><div class="ai-loader-ring"></div><p style="color:var(--text-secondary);font-size:.9rem">Mapping liquidity, profile, VWAP and the live depth snapshot…</p></div>`;
        try {
          const [ltf, htf] = (scanModeSelect.value || '5m,1h').split(',');
          const response = await premiumRadarFetch('/quant/verify-setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbol, ltf, htf }),
          });
          const raw = await response.text();
          let data = {};
          try { data = raw ? JSON.parse(raw) : {}; }
          catch { data = { detail: raw.slice(0, 500) || `Research failed with HTTP ${response.status}.` }; }
          if (!response.ok) throw new Error(data.detail || 'Causal review query failed.');
          renderAIResult(data);
        } catch (err) {
          modalBodyContent.innerHTML = `<div class="radar-empty-state" style="color:var(--neon-red);padding:2rem 1rem"><span class="icon">⚠</span><p>Causal review failed</p><span class="text-muted" style="font-size:.8rem">${escapeResearch(err.message)}</span></div>`;
        }
      }

      function renderAIResult(data) {
        const context = data.market_context || {};
        const components = context.components || {};
        const liquidity = data.liquidity_map || {};
        const positioning = data.positioning || {};
        const profile = data.volume_profile || {};
        const vwap = data.vwap_context || {};
        const label = value => String(value || 'UNAVAILABLE').replace(/_/g, ' ');
        const pool = data.target_pool ? `${label(data.target_pool.kind)} · ${data.target_pool.price}` : 'No directional pool mapped';
        const limitations = (data.limitations || []).map(item => `<li>${escapeResearch(item)}</li>`).join('');
        const contradictions = (context.contradictions || []).map(label).join(', ') || 'None reported';
        modalBodyContent.innerHTML = `
          <div class="ai-verdict-banner ${data.verdict === 'REVIEW_CANDIDATE' ? 'verdict-continuation' : 'verdict-reversal'}"><span>${escapeResearch(label(data.verdict))}</span><span>Evidence score: ${Number(data.evidence_score || 0)}/100</span></div>
          <div class="ai-levels-grid"><div class="ai-level-item"><span>Regime</span><strong>${escapeResearch(label(data.market_structure?.phase))}</strong></div><div class="ai-level-item"><span>Liquidity target</span><strong>${escapeResearch(pool)}</strong></div><div class="ai-level-item invalid"><span>Contradictions</span><strong>${escapeResearch(contradictions)}</strong></div></div>
          ${renderRadarStoryDetail(data)}
          <div class="ai-reasoning-section"><h4>Causal evidence</h4><ul class="ai-reasoning-list"><li>Positioning: ${escapeResearch(label(positioning.state))}</li><li>Volume profile: ${escapeResearch(label(profile.location))}</li><li>VWAP: ${escapeResearch(label(vwap.price_relation))}</li><li>Coverage: ${Number((context.coverage || {}).available_domains || 0)}/${Number((context.coverage || {}).required_domains || 4)} required domains</li></ul></div>
          <div class="ai-reasoning-section"><h4>Known limitations</h4><ul class="ai-reasoning-list">${limitations}</ul></div>
          <p style="font-size:.78rem;color:var(--text-muted);margin:1rem 0 0">${escapeResearch(data.trade_instruction || 'Radar does not authorize execution.')}</p>`;
      }

      function researchLabel(value, fallback = 'UNAVAILABLE') {
        const text = String(value ?? '').trim();
        return text ? text.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').toUpperCase() : fallback;
      }

      function escapeResearch(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      }

      function formatResearchPrice(value) {
        if (value === null || value === undefined || value === '') return 'UNAVAILABLE';
        const numeric = Number(value);
        return Number.isFinite(numeric) ? numeric.toLocaleString(undefined, { maximumFractionDigits: 6 }) : 'UNAVAILABLE';
      }

      function clearResearchBriefs() {
        const panel = document.getElementById('radar-research-briefs');
        const list = document.getElementById('research-brief-list');
        if (panel) panel.hidden = true;
        if (list) list.innerHTML = '';
      }

      function showResearchBriefNotice(title, message, status = 'WAITING') {
        const panel = document.getElementById('radar-research-briefs');
        const list = document.getElementById('research-brief-list');
        const runStatus = document.getElementById('research-run-status');
        const summary = document.getElementById('research-briefs-summary');
        if (panel) panel.hidden = false;
        if (runStatus) runStatus.textContent = status;
        if (summary) summary.textContent = 'Research briefs appear here after Radar has a current, usable market context.';
        if (list) list.innerHTML = `<div class="research-note"><b>${escapeResearch(title)}</b>${escapeResearch(message)}</div>`;
      }

      function toggleResearchBrief(index) {
        const brief = document.getElementById(`research-brief-${index}`);
        if (brief) brief.classList.toggle('expanded');
      }

      function renderTopResearchBriefs(briefs) {
        const list = document.getElementById('research-brief-list');
        const runStatus = document.getElementById('research-run-status');
        const summary = document.getElementById('research-briefs-summary');
        if (!list) return;
        const successful = briefs.filter(brief => !brief.error).length;
        if (runStatus) runStatus.textContent = `${successful} / ${briefs.length} READY`;
        if (summary) summary.textContent = 'The rank above remains deterministic. These refreshed briefs explain context, controls, and evidence gaps for manual research.';
        list.innerHTML = briefs.map((brief, index) => {
          if (brief.error) {
            return `<article class="radar-research-brief"><div class="research-brief-summary"><span class="research-rank">${index + 1}</span><div class="research-brief-title"><strong>${escapeResearch(brief.candidate.symbol)}</strong><span>Research refresh unavailable</span></div><span class="research-brief-state watch">RETRY LATER</span></div><div class="research-brief-detail"><p class="research-thesis">${escapeResearch(brief.error)}</p></div></article>`;
          }
          const detail = brief.detail;
          const candidate = brief.candidate;
          const context = detail.market_context || {};
          const structure = detail.market_structure || candidate.market_structure || {};
          const scanContext = candidate.market_context || {};
          const scanComponents = scanContext.components || {};
          const positioning = candidate.positioning || detail.positioning || {};
          const liveDepth = detail.liquidity || {};
          const target = detail.target_pool || candidate.target_pool || null;
          const levels = detail.levels || {};
          const contradictions = context.contradictions || candidate.contradictions || [];
          const limitations = detail.limitations || [];
          const direction = detail.direction || candidate.direction || 'WAIT';
          const storyPayload = {
            ...candidate,
            ...detail,
            direction,
            market_story: detail.market_story || candidate.market_story || {},
            market_context: detail.market_context || candidate.market_context || {},
          };
          const story = radarStoryView(storyPayload);
          const invalidated = String(story.state).toUpperCase() === 'INVALIDATED';
          const review = detail.verdict === 'REVIEW_CANDIDATE' && story.actionable && !story.chaseProhibited;
          const briefStateClass = invalidated ? 'invalid' : story.chaseProhibited ? 'stale' : review ? 'review' : 'watch';
          const briefStateCopy = invalidated
            ? 'INVALIDATED'
            : story.pullbackRequired
              ? 'PULLBACK REQUIRED'
              : story.chaseProhibited
                ? 'DO NOT CHASE'
                : review ? 'RESEARCH READY' : 'WATCH CONTEXT';
          const thesis = `${story.happened} ${story.happeningNow}`;
          const controlText = contradictions.length ? contradictions.map(researchLabel).join(' · ') : 'No contradiction reported in this brief';
          const limitationsText = limitations.length ? limitations[0] : 'No additional limitation was reported.';
          const cells = [
            ['Event lifecycle', `${researchLabel(story.eventType)} · ${researchLabel(story.state)}`, story.chaseProhibited || invalidated ? 'risk' : ''],
            ['Event age', story.age === null || story.age === undefined ? 'UNAVAILABLE' : `${story.age} completed bar${Number(story.age) === 1 ? '' : 's'}`, ''],
            ['Event level', formatResearchPrice(story.level), ''],
            ['Event invalidation', formatResearchPrice(story.invalidation), 'risk'],
            ['Liquidity target', target ? `${researchLabel(target.kind)} · ${formatResearchPrice(target.price)}` : 'No directional pool mapped', ''],
            ['Invalidation reference', formatResearchPrice(levels.invalidation_level), 'risk'],
            ['Positioning', `${researchLabel(positioning.state)}${positioning.oi_change_pct !== undefined ? ` · ${Number(positioning.oi_change_pct).toFixed(2)}% OI` : ''}`, ''],
            ['Order flow', researchLabel(scanComponents.order_flow?.bias || 'UNAVAILABLE'), ''],
            ['Live depth', liveDepth.available ? `${Number(liveDepth.depth_imbalance || 0).toFixed(2)} imbalance` : 'Depth unavailable', ''],
            ['Execution spread', liveDepth.spread_pct !== null && liveDepth.spread_pct !== undefined ? `${Number(liveDepth.spread_pct).toFixed(4)}%` : 'Spread unavailable', ''],
          ];
          return `<article class="radar-research-brief" id="research-brief-${index}">
            <div class="research-brief-summary" role="button" tabindex="0" onclick="toggleResearchBrief(${index})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleResearchBrief(${index})}">
              <span class="research-rank">${index + 1}</span>
              <div class="research-brief-title"><strong>${escapeResearch(candidate.symbol)}</strong><span>${escapeResearch(thesis)}</span></div>
              <span class="research-brief-state ${briefStateClass}">${briefStateCopy}</span>
            </div>
            <div class="research-brief-detail">
              <p class="research-thesis">${escapeResearch(thesis)}</p>
              ${renderRadarStoryDetail(storyPayload, true)}
              <div class="research-evidence-grid">${cells.map(([label, value, tone]) => `<div class="research-evidence-cell ${tone}"><span>${escapeResearch(label)}</span><strong>${escapeResearch(value)}</strong></div>`).join('')}</div>
              <div class="research-brief-footer"><div class="research-note risk"><b>Contradictory evidence</b>${escapeResearch(controlText)}</div><div class="research-note"><b>Known limitation</b>${escapeResearch(limitationsText)}</div></div>
              <button class="research-expand" type="button" onclick="toggleResearchBrief(${index})">Collapse brief</button>
            </div>
          </article>`;
        }).join('');
      }

      async function buildTopResearchBriefs() {
        if (isBuildingResearchBriefs) return;
        const panel = document.getElementById('radar-research-briefs');
        const list = document.getElementById('research-brief-list');
        const runStatus = document.getElementById('research-run-status');
        if (!radarScanReady || !rawBreakouts.length) {
          const message = radarScanReady
            ? 'This scan did not produce an eligible Radar context. Change the timeframe or wait for the next completed scan.'
            : 'Radar is still collecting the current market context. The button will activate when the scan is ready.';
          showResearchBriefNotice('Research briefs are not ready yet', message, radarScanReady ? 'NO SETUPS' : 'SCANNING');
          return;
        }
        const ranked = [...rawBreakouts].sort((left, right) => {
          const candidateGap = Number(right.review_status === 'REVIEW_CANDIDATE') - Number(left.review_status === 'REVIEW_CANDIDATE');
          return candidateGap || Number(right.score || 0) - Number(left.score || 0);
        }).slice(0, 3);
        const [ltf, htf] = (scanModeSelect.value || '5m,1h').split(',');
        isBuildingResearchBriefs = true;
        setResearchButtonState('BUILDING');
        if (panel) panel.hidden = false;
        if (runStatus) runStatus.textContent = 'REFRESHING EVIDENCE';
        if (list) list.innerHTML = `<div class="research-note"><b>Research queue</b>Refreshing structure, liquidity, VWAP, profile, and depth evidence for ${ranked.length} Radar contexts…</div>`;
        try {
          const briefs = await Promise.all(ranked.map(async candidate => {
            const controller = new AbortController();
            const timeoutId = window.setTimeout(() => controller.abort(), 15_000);
            try {
              const response = await premiumRadarFetch('/quant/verify-setup', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: candidate.symbol, ltf, htf }),
                signal: controller.signal,
              });
              const detail = await radarReadApiPayload(response);
              if (!response.ok) throw new Error(detail.detail || 'The current research snapshot could not be refreshed.');
              return { candidate, detail };
            } catch (error) {
              const message = error?.name === 'AbortError'
                ? 'Research refresh timed out after 15 seconds. Please retry when market data is available.'
                : error.message || 'The current research snapshot could not be refreshed.';
              return { candidate, error: message };
            } finally {
              window.clearTimeout(timeoutId);
            }
          }));
          renderTopResearchBriefs(briefs);
          panel?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (error) {
          showResearchBriefNotice('Research refresh failed', error.message || 'Radar could not build the selected research briefs. Please retry.', 'RETRY LATER');
          panel?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } finally {
          isBuildingResearchBriefs = false;
          setResearchButtonState();
        }
      }

      // Discovery is public and deterministic; detailed briefs stay protected.
      function radarRefreshSeconds(ltf, htf) {
        if (ltf === '1h' && htf === '1d') return 600;
        if (ltf === '15m' && htf === '4h') return 120;
        return 30;
      }

      function sharedRadarNow() {
        return Date.now() + radarServerClockOffsetMs;
      }

      async function fetchBreakouts() {
        if (isFetchingRadar) return;
        isFetchingRadar = true;
        radarScanReady = false;
        setResearchButtonState('SCANNING');
        showRadarEvidenceLoading();
        spinner.style.display = 'block';
        spinner.classList.add('is-active');
        refreshText.textContent = 'Scanning causal market evidence...';
        const [ltf, htf] = (scanModeSelect.value || '5m,1h').split(',');
        try {
          const requestStartedAt = Date.now();
          const response = await publicRadarFetch(`/quant/breakout-radar?ltf=${ltf}&htf=${htf}`);
          const responseReceivedAt = Date.now();
          if (!response.ok) {
            const errData = await radarReadApiPayload(response);
            throw new Error(errData.detail || 'API query failed.');
          }
          rawBreakouts = await radarReadApiPayload(response);
          const snapshotState = response.headers.get('X-Radar-Snapshot-State');
          const snapshotAt = response.headers.get('X-Radar-Snapshot-At');
          const nextRefreshAt = response.headers.get('X-Radar-Next-Refresh-At');
          const serverNow = response.headers.get('X-Radar-Server-Time');
          radarSnapshotStale = snapshotState === 'STALE_REFRESHING';
          radarSnapshotAtMs = snapshotAt ? Date.parse(snapshotAt) : 0;
          radarFailureCount = 0;
          const parsedServerNow = serverNow ? Date.parse(serverNow) : NaN;
          if (Number.isFinite(parsedServerNow)) {
            const estimatedServerTimeAtReceipt = parsedServerNow + (responseReceivedAt - requestStartedAt) / 2;
            radarServerClockOffsetMs = estimatedServerTimeAtReceipt - responseReceivedAt;
          }
          const parsedRefreshAt = nextRefreshAt ? Date.parse(nextRefreshAt) : NaN;
          if (Number.isFinite(parsedRefreshAt)) {
            nextRadarRefreshAtMs = parsedRefreshAt;
            secondsRemaining = Math.max(0, Math.ceil((nextRadarRefreshAtMs - sharedRadarNow()) / 1000));
          } else {
            nextRadarRefreshAtMs = sharedRadarNow() + radarRefreshSeconds(ltf, htf) * 1000;
            secondsRemaining = radarRefreshSeconds(ltf, htf);
          }
          if (snapshotState === 'STALE_REFRESHING') {
            refreshText.textContent = 'Showing the last shared snapshot while one market refresh runs…';
          } else if (snapshotAt) {
            refreshText.textContent = `Shared market snapshot · ${new Date(snapshotAt).toLocaleTimeString()}`;
          }
          radarScanReady = !radarSnapshotStale;
          clearResearchBriefs();
          renderTable();
          updateSummary();
          if (rawBreakouts.length) {
            setResearchButtonState(radarSnapshotStale ? 'STALE' : 'READY');
          } else {
            setResearchButtonState('EMPTY');
            showResearchBriefNotice('No eligible Radar contexts', 'The scan completed, but current structure, liquidity, and volatility conditions did not produce a researchable setup. Radar will check again automatically.', 'NO SETUPS');
          }
        } catch (error) {
          const hasLastSnapshot = rawBreakouts.length > 0;
          radarScanReady = false;
          radarSnapshotStale = hasLastSnapshot;
          if (!hasLastSnapshot) radarSnapshotAtMs = 0;
          radarFailureCount += 1;
          const retrySeconds = Math.min(60, 10 * (2 ** Math.min(radarFailureCount - 1, 3)));
          nextRadarRefreshAtMs = sharedRadarNow() + retrySeconds * 1000;
          console.error('Error loading Radar data:', error);
          setResearchButtonState(hasLastSnapshot ? 'STALE' : 'EMPTY');
          if (hasLastSnapshot) {
            renderTable();
            updateSummary();
          }
          showResearchBriefNotice(
            hasLastSnapshot ? 'Live refresh unavailable' : 'Radar scan unavailable',
            hasLastSnapshot
              ? 'The last shared snapshot remains visible for context, but Research is locked until a fresh server snapshot arrives.'
              : 'Public market discovery could not complete. Check the market-data connection, then let Radar retry.',
            hasLastSnapshot ? 'STALE · RESEARCH LOCKED' : 'SCAN FAILED'
          );
        } finally {
          isFetchingRadar = false;
          stopRadarEvidenceLoading();
          spinner.style.display = 'none';
          spinner.classList.remove('is-active');
          if (!nextRadarRefreshAtMs || nextRadarRefreshAtMs <= sharedRadarNow()) {
            nextRadarRefreshAtMs = sharedRadarNow() + radarRefreshSeconds(ltf, htf) * 1000;
          }
        }
      }

      // Modal close controls
      modalCloseBtn.addEventListener('click', () => {
        modalOverlay.classList.remove('active');
      });

      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
          modalOverlay.classList.remove('active');
        }
      });


      function updateSummary() {
        const activeCount = rawBreakouts.filter(item => item.review_status === 'REVIEW_CANDIDATE').length;
        breakoutCountEl.textContent = activeCount;
        const topItem = rawBreakouts[0];
        topScoreEl.textContent = topItem ? topItem.score : '-';
        topSymbolEl.textContent = topItem ? topItem.symbol : '-';
        const states = rawBreakouts.map(item => item.volatility_context?.state).filter(Boolean);
        const expansionCount = states.filter(state => state === 'EXPANSION').length;
        const compressionCount = states.filter(state => state === 'COMPRESSION').length;
        const dominant = expansionCount > compressionCount ? 'EXPANSION' : compressionCount > expansionCount ? 'COMPRESSION' : 'NORMAL';
        volStateEl.textContent = dominant;
        volStateEl.style.color = dominant === 'EXPANSION' ? 'var(--neon-gold)' : dominant === 'COMPRESSION' ? 'var(--neon-purple)' : 'var(--neon-blue)';
      }

      // Setup filter listeners
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.getAttribute('data-filter');
          renderTable();
        });
      });

      // Scan Mode Dropdown change listener
      scanModeSelect.addEventListener('change', () => {
        fetchBreakouts();
      });

      // Timing scanning loops
      function startTimer() {
        refreshTimer = setInterval(() => {
          if (document.hidden) return;
          secondsRemaining = Math.max(0, Math.ceil((nextRadarRefreshAtMs - sharedRadarNow()) / 1000));
          if (secondsRemaining <= 0) {
            fetchBreakouts();
          } else if (radarSnapshotStale) {
            const ageSeconds = radarSnapshotAtMs
              ? Math.max(0, Math.floor((sharedRadarNow() - radarSnapshotAtMs) / 1000))
              : null;
            refreshText.textContent = `Refreshing shared snapshot${ageSeconds === null ? '' : ` - ${ageSeconds}s old`} - retry in ${secondsRemaining}s`;
          } else {
            refreshText.textContent = `Refreshes in ${secondsRemaining}s`;
          }
        }, 1000);
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden || isFetchingRadar) return;
        secondsRemaining = Math.max(0, Math.ceil((nextRadarRefreshAtMs - sharedRadarNow()) / 1000));
        if (secondsRemaining <= 0) fetchBreakouts();
      });

      async function startRadar() {
        try {
          await fetchBreakouts();
          startTimer();
        } catch (error) {
          rawBreakouts = [];
          radarScanReady = false;
          setResearchButtonState();
          showResearchBriefNotice('Radar scan unavailable', 'Public market discovery could not complete. Radar will retry automatically.', 'SCAN FAILED');
        }
      }
      startRadar();
      setResearchButtonState();
    </script>
    <script src="ambient-motion.js?v=20260802-perf1"></script>
